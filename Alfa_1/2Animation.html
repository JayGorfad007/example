<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(#4fc3f7, #81d4fa);
            overflow: hidden;
            font-family: Arial;
        }

        .balloon {
            position: absolute;
            bottom: -200px;
            width: 150px;
            animation: float 12s ease-in-out infinite;
        }

        .balloon img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .b1 {
            left: 10%;
            animation-delay: 0s;
        }

        .b2 {
            left: 40%;
            animation-delay: 4s;
        }

        .b3 {
            left: 70%;
            animation-delay: 8s;
        }

        @keyframes float {

            0% {
                bottom: -200px;
                transform: translateX(0);
            }

            50% {
                transform: translateX(40px);
            }

            100% {
                bottom: 120%;
                transform: translateX(-40px);
            }

        }

        .cloud {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 200px;
            height: 60px;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
        }

        .cloud::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 30px;
            width: 100px;
            height: 80px;
            background: white;
            border-radius: 50%;
        }

        .cloud::after {
            content: "";
            position: absolute;
            top: -10px;
            left: 100px;
            width: 80px;
            height: 60px;
            background: white;
            border-radius: 50%;
        }
    </style>
</head>

<body>


    <div class="cloud"></div>


    <div class="balloon b1">
        <img src="Balon..jpg">
    </div>

    <div class="balloon b2">
        <img src="Balon..jpg">
    </div>

    <div class="balloon b3">
        <img src="Balon..jpg">
    </div>

</body>

</html>
