<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #008585;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
           
           
        }
        form{
            background-color: #cbd8df;
            width: 300px;
            height: 250px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
           
            /* margin-top: 200px; */
          
            
        }
        input{
            width: 100%;
            height: 30px;
            margin: 10px 0;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
           
        }
        button{
            transform: translateX(-100px);
            width: 250px;
            height: 35px;
            padding: 10px;
            background-color: #4caf50;
            border-radius: 5px;
            margin-left: 130px;
            color: white;    
        } 
    </style>
</head>
<body>
    
    <form method="post">
        
            <h2 style="text-align:center;">Member Login</h2>
       
            <input type="text" name="User Name" placeholder="User Name">
        
        
            <input type="text" name="Password" placeholder="Password">
        
            <button type="submit">Login</button>

            <a href="">Forget Password...</a>
        
    </form>
</body>
</html>
