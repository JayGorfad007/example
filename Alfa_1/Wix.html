<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Header */
header {
    background: #222;
    color: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

header nav a:hover {
    color: orange;
}

/* Hero */
.hero {
    background: linear-gradient(to right, #4facfe, #00f2fe);
    color: white;
    text-align: center;
    padding: 80px 20px;
}

.hero button {
    margin-top: 20px;
    padding: 10px 25px;
    border: none;
    background: white;
    color: #333;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

.hero button:hover {
    background: #222;
    color: white;
}

/* Content */
.content {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 50px;
}

.card {
    background: #f4f4f4;
    padding: 20px;
    width: 250px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* Footer */
footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 15px;
}
    </style>
</head>
<body>
      <!-- Header -->
    <header>
        <h1>My Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Welcome to My Website</h2>
        <p>Simple HTML & CSS Website</p>
        <button>Get Started</button>
    </section>

    <!-- Content -->
    <section class="content">
        <div class="card">
            <h3>HTML</h3>
            <p>HTML website structure banave che.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>CSS website ne design aape che.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>JavaScript website interactive banave che.</p>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

</body>
</html>
