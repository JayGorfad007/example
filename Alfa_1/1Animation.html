<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        /* Rotating Circle */

        .circle {
            width: 100px;
            height: 100px;
            border: 6px solid #ccc;
            border-top: 6px solid blue;
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        /* Hover Effect */

        .circle:hover {
            animation-play-state: paused;
            transform: scale(1.2);
        }

        /* Animation */

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Center Box */

        .box {
            width: 220px;
            height: 200px;
            background: #2196f3;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border-radius: 10px;
        }
    </style>
    </head>

    <body>

        <div class="container">

            <div class="circle"></div>

            <div class="box">
                Center Box
            </div>

        </div>

    </body>

</html>
