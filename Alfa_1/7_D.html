<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfrom:franslate</title>
    <style>
        body {
            justify-items: center;
        }

        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
            transform: translateY(96px);

        }

        .main2 {
            display: flex;
            gap: 20px;
            transform: translateY(88px);
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: rgb(223, 223, 223);
            border-radius: 5px solid;
            border-radius: 5px;
            transform: translate(300px, 400px), scale(.5);
            transform: 4s;
        }

        .Box2 {
            background-color: blue;
            width: 50px;
            height: 50px;
            border-radius: 30px;
        }

        .Box2:hover {
            width: 200px;
            height: 200px;
            border-radius: 0;
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="box">
            <div class="Box2"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: brown;"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: rgb(179, 223, 18);"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: rgb(25, 233, 170);"></div>
        </div>

    </div>

    <div class="main2">


        <div class="box">
            <div class="Box2" style="background-color: rgb(214, 249, 13);"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: rgb(245, 13, 249);"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: rgb(249, 233, 13);"></div>
        </div>

        <div class="box">
            <div class="Box2" style="background-color: rgb(0, 222, 251);"></div>
        </div>

    </div>


</body>

</html>
