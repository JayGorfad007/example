<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colletta Header</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: white;
    }

    header {
      border: 2px solid black;
      margin: 20px;
      padding: 20px 40px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 35px;
      font-family: cursive;
      font-weight: bold;
    }

    .logo span {
      display: block;
      font-size: 12px;
      letter-spacing: 2px;
      font-family: Arial;
    }

    ul {
      list-style: none;
      display: flex;
      gap: 30px;
      align-items: center;
    }

    ul li a {
      text-decoration: none;
      color: black;
      font-size: 14px;
      font-weight: 600;
    }

    ul li a:hover {
      color: red;
    }

    .btn {
      background: black;
      color: white;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: bold;
    }


  

  </style>
</head>
<body>

  <header>
    <nav>
    
      <div class="logo">
        Colletta
        <span>ITALIAN FOOD & WINE</span>
      </div>

      <ul>
        <li><a href="#">HOURS & LOCATION</a></li>
        <li><a href="#">MENUS</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">GALLERY</a></li>
        <li><a href="#">PRIVATE DINING & EVENTS</a></li>
        <li><a href="#" class="btn">RESERVATIONS</a></li>
      </ul>
    </nav>
  </header>

  

</body>
</html>
