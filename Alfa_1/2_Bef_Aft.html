<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Both Overlay Hover</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .img-box {
      width: 300px;
      height: 220px;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      cursor: pointer;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-box::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 50%;
      background: rgba(255, 0, 0, 0.6);
      top: -50%;
      left: 0;
      transition: 0.5s;
    }

    .img-box::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 50%;
      background: rgba(0, 0, 255, 0.6);
      bottom: -50%;
      left: 0;
      transition: 0.5s;
    }

    .img-box:hover::before {
      top: 0;
    }

    .img-box:hover::after {
      bottom: 0;
    }
  </style>

</head>

<body>

  <div class="img-box">
    <img src="https://picsum.photos/id/1015/600/400" alt="image">
  </div>

</body>
</html>
