<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid #ccc;
            border-radius: 3px;
            width: 350px;
            height: 40%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .tbl {
            width: 100%;
            /* border: 2px solid rgb(139, 226, 255); */
            padding: 30px;
        }

        .txt {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            width: 100%;
            padding: 9px;
            background-color: #3a86ff;
            color: white;
            border: none;
            font-weight: 500;
            border-radius: 5px;
            margin-top: 1px;
        }

        .forgot {
            display: inline-block;
            margin-top: 15px;
           
            font-size: 15px;
            color: #3a86ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .forgot:hover {
            color: #ff5500;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <form action="">
                <table class="tbl">

                    <tr>
                        <td>
                            <h1>Member Login</h1>
                        </td>
                    </tr>

                    <tr>
                        <td><input type="text" placeholder="User Name" class="txt"></td>
                    </tr>

                    <tr>
                        <td><input type="text" placeholder="Password" class="txt"></td>
                    </tr>

                    <tr>
                        <td><input type="button" value="Login" class="btn"></td>
                    </tr>

                    <tr>
                        <td align="center"><a href="">Forgot Password?</a></td>
                    </tr>

                </table>
            </form>
        </div>
    </div>
</body>

</html>
