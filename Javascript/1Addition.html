<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calc</title>
</head>

<body>

    <script>
        let a = parseInt(prompt("Enter value of a: "));
        let b = parseInt(prompt("Enter value of b: "));

        let add = a + b;
        let sub = a - b;
        let multi = a * b;
        let div = a / b;

        alert(
            "Addition: " + add +
            "\nSubtraction: " + sub +
            "\nMultiplication: " + multi +
            "\nDivision: " + div
        );
    </script>

</body>

</html>
